<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAL Notes</title>
  <style>
    /* ============================================
       GLOBAL RESET & BASE STYLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f5f8ff 50%, #dce8fc 100%);
      min-height: 100vh;
      color: #1a3a5c;
    }

    /* ============================================
       LOGO POPUP / SPLASH MODAL
       ============================================ */
    #splash-overlay {
      position: fixed;
      inset: 0;
      background: rgba(21, 101, 192, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: splashFadeIn 0.5s ease forwards;
      cursor: pointer;
    }

    #splash-overlay.fade-out {
      animation: splashFadeOut 0.5s ease forwards;
    }

    @keyframes splashFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes splashFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; pointer-events: none; }
    }

    .splash-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 52px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(21, 101, 192, 0.3);
      animation: splashCardPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      max-width: 360px;
      width: 90%;
    }

    @keyframes splashCardPop {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .splash-card img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 16px;
    }

    .splash-card p {
      margin-top: 16px;
      color: #5a7da8;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    /* ============================================
       HEADER
       ============================================ */
    header {
      background: linear-gradient(135deg, #1565c0 0%, #1e88e5 50%, #2196f3 100%);
      padding: 20px 30px;
      box-shadow: 0 4px 20px rgba(21, 101, 192, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 700;
